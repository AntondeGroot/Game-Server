name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Structural lint of the API spec. Runs before the build because code generation
  # accepts broken specs and silently produces wrong models.
  lint-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # Major pinned so a new Redocly major can't turn CI red on an untouched spec.
      - name: Lint gameroom_openapi.yaml
        run: npx --yes @redocly/cli@2 lint gameroom_openapi.yaml --config .redocly.yaml

  # The Angular client's gates. Maven builds it again for the jar, but only these steps lint and
  # test it.
  client:
    needs: lint-openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      # openapi-generator runs on Java.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'

      - run: npm ci
      - name: Generate the API client
        run: npm run generate
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run lint:folders
      - run: npm run format:check
      - name: Unit tests with coverage
        run: npm test -- --watch=false --coverage
      - run: npm run build
      - name: Audit dependencies
        run: npm run audit:deps

  build:
    needs: lint-openapi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Maven builds the Angular client into the jar.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'
          cache: maven

      # Builds all modules (including GWT client compilation) and runs every test
      # except the browser-based E2E suite. Using `install` so GameRoom-client.war
      # lands in the local Maven repo and is available for the E2E step below.
      - name: Build and run unit + integration tests
        run: mvn -B clean install -DexcludedGroups=e2e

      # ubuntu-latest has Google Chrome pre-installed; Selenium Manager (bundled in
      # selenium-java 4.6+) automatically downloads the matching ChromeDriver.
      - name: Run E2E tests
        run: mvn test -pl GameRoom-server -Dgroups=e2e

      - name: Keep the jar for the Lighthouse job
        uses: actions/upload-artifact@v7
        with:
          name: gameroom-jar
          path: GameRoom-server/target/GameRoom.jar
          retention-days: 1

  # Lighthouse audits of the packaged jar: the GWT client at / and the Angular client at /next/.
  # The floors in lighthouserc.json are the scores of 2026-11-18, pinned so they can only go up.
  # TODO: raise them as the pages improve; the GWT floors go away once /next/ replaces it.
  # Performance only warns: shared runners make it too noisy to fail a build on.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'

      - uses: actions/download-artifact@v8
        with:
          name: gameroom-jar

      # Uses the Chrome that ubuntu-latest ships with.
      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.16.1 autorun

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 14

  # The only check the branch ruleset (.github/ruleset.json) requires, so jobs can be added or
  # renamed without editing it. `if: always()` matters: without it a failed job skips this one,
  # and a skipped required check counts as passing.
  ci:
    if: always()
    needs: [lint-openapi, client, build, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
