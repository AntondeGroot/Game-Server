name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Structural lint of the API spec. Runs before the build because code generation
  # accepts broken specs and silently produces wrong models.
  lint-openapi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Major pinned so a new Redocly major can't turn CI red on an untouched spec.
      - name: Lint gameroom_openapi.yaml
        run: npx --yes @redocly/cli@2 lint gameroom_openapi.yaml --config .redocly.yaml

  build:
    needs: lint-openapi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25.0.5+8.0.LTS'
          distribution: 'temurin'
          cache: maven

      # Builds all modules (including GWT client compilation) and runs every test
      # except the browser-based E2E suite. Using `install` so GameRoom-client.war
      # lands in the local Maven repo and is available for the E2E step below.
      - name: Build and run unit + integration tests
        run: mvn -B clean install -DexcludedGroups=e2e

      # ubuntu-latest has Google Chrome pre-installed; Selenium Manager (bundled in
      # selenium-java 4.6+) automatically downloads the matching ChromeDriver.
      - name: Run E2E tests
        run: mvn test -pl GameRoom-server -Dgroups=e2e